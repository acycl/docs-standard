name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The standard's own docs follow the standard, checked by the workflow
  # that projects call.
  docs:
    uses: ./.github/workflows/docs.yml

  # The converter's tests and type check.
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - name: Check the type declarations are current
        run: |
          npm run types
          if [ -n "$(git status --porcelain -- types)" ]; then
            git status --porcelain -- types
            git diff -- types
            echo "::error::types/ is out of date; run npm run types and commit the result"
            exit 1
          fi
